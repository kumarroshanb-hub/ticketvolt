<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:20px;background:#f4f4f4;font-family:'Montserrat',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
  <table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:8px;overflow:hidden;">
    <tr><td style="padding:24px 30px;background:#333;text-align:center;">
      <h1 style="margin:0;font-size:20px;color:#fff;">🎫 TicketVolt</h1>
    </td></tr>
    <tr><td style="padding:30px;text-align:center;">
      <h2 style="margin:0 0 12px;font-size:18px;color:#1A202C;">Your verification code</h2>
      <p style="color:#4A5568;">Hi {{ user.first_name|default:user.username }},</p>
      <p style="color:#4A5568;">Use this code to sign in. It expires in {{ expiry_minutes }} minutes.</p>
      <div style="font-size:32px;font-weight:700;letter-spacing:8px;color:#FF2A2A;
                  background:#f9f9f9;border:1px dashed #FF2A2A;border-radius:8px;
                  padding:18px;margin:24px auto;display:inline-block;">{{ code }}</div>
      <p style="font-size:12px;color:#888;">If you didn't request this, ignore this email.</p>
    </td></tr>
    <tr><td style="padding:20px 30px;background:#f9f9f9;text-align:center;">
      <p style="margin:0;font-size:12px;color:#888;">&copy; {% now "Y" %} TicketVolt. All rights reserved.</p>
    </td></tr>
  </table>
</td></tr></table>
</body></html>
