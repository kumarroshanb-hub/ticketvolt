# fly.toml app configuration file generated for ticketvolt-baileys-gateway on 2026-09-15T13:36:02+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ticketvolt-baileys-gateway'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "baileys_data"
  destination = "/app/sessions"
