# docker-compose.prod.yml
#
# ✅ FIX [P37]: this file is a **local Docker + Neon DB TEST environment**,
# not a production deployment. The name is kept for backwards compatibility
# with existing runbooks, but the header now makes the intent explicit.
#
# Why this matters:
#   • `backend` and `baileys-gateway` bind-mount the source tree into
#     the container. That is the whole point for a test environment
#     (hot reload), but it means the container runs the HOST's
#     checkout — not the image built from `./backend/Dockerfile`.
#   • For a real production deploy, use a separate compose file that
#     builds from the Dockerfile with NO bind mounts, or use the
#     managed platform (Render / Fly) with the built images.
#
# ✅ FIX [P39]: only the primary `backend` service runs `migrate` and
# `collectstatic` on boot. Previously `backend`, `celery-worker`, and
# `celery-beat` all ran the same entrypoint concurrently, which can
# produce partial migrations or "relation already exists" races on
# cold start. The workers now set RUN_MIGRATIONS=0.

services:
  redis:
    image: redis:7-alpine
    container_name: ticketvolt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticketvolt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ticketvolt-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.neon
    environment:
      ENVIRONMENT: production
      DEBUG: 'False'
      # ✅ FIX [P39]: only this service runs migrations on boot.
      RUN_MIGRATIONS: '1'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # NOTE: bind mount is intentional for this TEST environment only.
      # See file header.
      - ./backend:/app
    networks:
      - ticketvolt-network
    command: python manage.py runserver 0.0.0.0:8000

  celery-worker:
    build: ./backend
    container_name: ticketvolt-celery
    command: celery -A core worker --loglevel=info --concurrency=4
    env_file:
      - ./backend/.env.neon
    environment:
      ENVIRONMENT: production
      # ✅ FIX [P39]: workers must NOT run migrate/collectstatic.
      RUN_MIGRATIONS: '0'
    depends_on:
      - redis
      - backend
    volumes:
      - ./backend:/app
    networks:
      - ticketvolt-network

  celery-beat:
    build: ./backend
    container_name: ticketvolt-celery-beat
    command: celery -A core beat --loglevel=info
    env_file:
      - ./backend/.env.neon
    environment:
      ENVIRONMENT: production
      # ✅ FIX [P39]: beat must NOT run migrate/collectstatic either.
      RUN_MIGRATIONS: '0'
    depends_on:
      - redis
      - celery-worker
      - backend
    volumes:
      - ./backend:/app
    networks:
      - ticketvolt-network

  frontend:
    build: ./frontend
    container_name: ticketvolt-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ticketvolt-network

  baileys-gateway:
    build: ./baileys-gateway
    container_name: ticketvolt-baileys
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      DJANGO_API_URL: http://backend:8000/api
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # ✅ FIX [P20] dependency: baileys-gateway now persists conversation
      # sessions to Redis (see whatsappService.js). REDIS_URL is already
      # present in the original file — keeping the comment so anyone
      # reading the file understands why it's load-bearing.
      REDIS_URL: redis://redis:6379
      WHATSAPP_ENABLED: 'True'
      WHATSAPP_TICKET_DELIVERY_ENABLED: 'False'
      WHATSAPP_GATEWAY_URL: http://baileys-gateway:3002
    volumes:
      - ./baileys-gateway:/app
      - /app/node_modules
      - ./baileys-gateway/sessions:/app/sessions
    networks:
      - ticketvolt-network
    depends_on:
      - redis
      - backend

volumes:
  redis_data:

networks:
  ticketvolt-network:
    driver: bridge