# docker-compose.yml - LOCAL DEVELOPMENT
services:
  postgres:
    image: postgres:15
    container_name: ticketvolt-postgres
    environment:
      POSTGRES_USER: ticketvolt
      POSTGRES_PASSWORD: pgress_iaStopqal
      POSTGRES_DB: ticketvolt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticketvolt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketvolt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticketvolt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ticketvolt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ticketvolt-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.local     # ← Load from .env.local
    environment:
      ENVIRONMENT: local          # ← Selects local.py settings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - ticketvolt-network
    command: python manage.py runserver 0.0.0.0:8000

  celery-worker:
    build: ./backend
    container_name: ticketvolt-celery
    command: celery -A core worker --loglevel=info --concurrency=4
    env_file:
      - ./backend/.env.local
    environment:
      ENVIRONMENT: local
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
    networks:
      - ticketvolt-network

  celery-beat:
    build: ./backend
    container_name: ticketvolt-celery-beat
    command: celery -A core beat --loglevel=info
    env_file:
      - ./backend/.env.local
    environment:
      ENVIRONMENT: local
    depends_on:
      - postgres
      - redis
      - celery-worker
      - backend
    volumes:
      - ./backend:/app
    networks:
      - ticketvolt-network

  frontend:
    build: ./frontend
    container_name: ticketvolt-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ticketvolt-network

  baileys-gateway:
    build: ./baileys-gateway
    container_name: ticketvolt-baileys
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      DJANGO_API_URL: http://backend:8000/api
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      REDIS_URL: redis://redis:6379
      WHATSAPP_ENABLED: 'True'
      WHATSAPP_TICKET_DELIVERY_ENABLED: 'False'
      WHATSAPP_GATEWAY_URL: http://baileys-gateway:3002
    volumes:
      - ./baileys-gateway:/app
      - /app/node_modules
      - ./baileys-gateway/sessions:/app/sessions
    networks:
      - ticketvolt-network
    depends_on:
      - redis
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  ticketvolt-network:
    driver: bridge