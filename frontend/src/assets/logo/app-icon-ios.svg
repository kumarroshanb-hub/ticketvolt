<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="TiKetVault iOS App Icon">
  <title>TiKetVault — iOS App Icon</title>

  <!-- iOS rounded-square: 180px corner radius on a 1024 canvas -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="#333333"/>

  <!-- Ticket panel (white fill, charcoal border made from notches) -->
  <g>
    <!-- Outer ticket outline (charcoal) -->
    <path
      d="M 250,340
         H 774
         A 16,16 0 0 1 790,356
         V 430
         A 48,48 0 0 0 790,594
         V 668
         A 16,16 0 0 1 774,684
         H 250
         A 16,16 0 0 1 234,668
         V 594
         A 48,48 0 0 0 234,430
         V 356
         A 16,16 0 0 1 250,340 Z"
      fill="#333333"/>

    <!-- Inner white ticket panel -->
    <rect x="262" y="352" width="500" height="320" rx="6" fill="#FFFFFF"/>

    <!-- Left concave notch (cut into white) -->
    <circle cx="262" cy="512" r="40" fill="#333333"/>
    <!-- Right concave notch -->
    <circle cx="762" cy="512" r="40" fill="#333333"/>
  </g>

  <!-- "TK" wordmark — Montserrat Bold -->
  <g font-family="'Montserrat', 'Segoe UI', Arial, sans-serif"
     font-weight="700"
     font-size="200"
     text-anchor="start">

    <!-- T — white -->
    <text x="360" y="596"
          textLength="100"
          lengthAdjust="spacingAndGlyphs"
          fill="#FFFFFF">T</text>

    <!-- K — red -->
    <text x="510" y="596"
          textLength="120"
          lengthAdjust="spacingAndGlyphs"
          fill="#FF2A2A">K</text>

  </g>
</svg>