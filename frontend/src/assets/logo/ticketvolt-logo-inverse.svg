             Q 350,114 350,140 Z
             M 363,150 L 363,154
             Q 359,156 357,157
             Q 354,158 354,157
             Q 354,161 357,161
             Q 360,161 363,156 Z"/>

    <!-- u -->
    <path d="M 386,114 L 386,154
