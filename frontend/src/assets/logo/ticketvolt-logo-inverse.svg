             Q 376,114 376,140
             L 376,170 L 363,170 L 363,164
             Q 359,170 353,170
             Q 347,170 347,158
             Q 347,150 353,148
             L 363,145 L 363,141
             Q 363,128 358,128
             Q 353,128 353,135
